name: Bug report
description: Report a reproducible problem with ProblemSpot.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve ProblemSpot. Please do not include passwords, access tokens, private evidence, or personal information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug clearly.
      placeholder: Tell us what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps that make the bug happen.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove secrets and personal information before sharing.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, app version, or commit hash.
      placeholder: "e.g. Firefox on Ubuntu"
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a similar report.
          required: true
        - label: I removed secrets and private personal information.
          required: true
